{% include base_path %}

<!-- start custom head snippets -->

<!-- favicons (JJ monogram); bump ?v= when the icons change -->
<link rel="icon" href="{{ base_path }}/images/favicon.ico?v=2" sizes="48x48">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-16x16.png?v=2" sizes="16x16">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=2" sizes="32x32">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-96x96.png?v=2" sizes="96x96">
<link rel="icon" type="image/png" href="{{ base_path }}/images/android-chrome-192x192.png?v=2" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=2">
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=2">
<meta name="msapplication-TileColor" content="#012169">
<meta name="msapplication-TileImage" content="{{ base_path }}/images/mstile-144x144.png?v=2">
<meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml?v=2">
<meta name="theme-color" content="#ffffff">
<!-- preload the main text font (Noto Sans, latin) -->
<link rel="preload" href="{{ base_path }}/assets/fonts/noto-sans/noto-sans-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
